services:
  db:
    image: postgres:16-alpine
    container_name: garagemaster-db
    environment:
      POSTGRES_DB: garagemaster
      POSTGRES_USER: postgres
      # Required. No default: the stack refuses to start without a real password.
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in your environment or .env}
    volumes:
      - garagemaster-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d garagemaster"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: garagemaster:latest
    container_name: garagemaster
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: garagemaster
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in your environment or .env}
      PORT: "4000"
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "8088:4000"
    restart: unless-stopped

volumes:
  garagemaster-pgdata:
